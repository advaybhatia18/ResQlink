name: Test and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python test suite
        run: python -m pytest

      - name: Run frontend API tests
        run: node --test frontend-tests/*.test.cjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        env:
          RESQLINK_API_URL: ${{ vars.RESQLINK_API_URL }}
        run: |
          mkdir _site
          cp *.html *.css auth-session.js auth-pages.js emergency-api.js emergency-submit.js _site/
          python - <<'PY'
          import ipaddress
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          value = os.environ.get("RESQLINK_API_URL", "").strip()
          parsed = urlparse(value)
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username
              or parsed.password
              or parsed.query
              or parsed.fragment
              or any(char.isspace() for char in value)
          ):
              raise SystemExit("Set the Actions variable RESQLINK_API_URL to the deployed HTTPS API base URL.")
          if parsed.hostname.lower() == "localhost":
              raise SystemExit("RESQLINK_API_URL must not point to localhost.")
          try:
              address = ipaddress.ip_address(parsed.hostname)
          except ValueError:
              address = None
          if address is not None and not address.is_global:
              raise SystemExit("RESQLINK_API_URL must not point to a private or loopback IP address.")
          api_url = value.rstrip("/")
          Path("_site/api-config.js").write_text(
              f"window.RESQLINK_API_URL = {json.dumps(api_url)};\n",
              encoding="utf-8",
          )
          PY
          touch _site/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
