services:
  - type: web
    name: resqlink-api
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt
      && gcc -shared -fPIC -o core/libemergency.so core/emergency.c
      && cd backend
      && python -c 'from emergency_engine import process_emergency; assert process_emergency(5) == {"severity": 5, "label": "CRITICAL", "priority": 100}'
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://advaybhatia18.github.io
      - key: PASSWORD_RESET_REDIRECT_URL
        sync: false
