services:
  - type: web
    name: resqlink-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && gcc -shared -fPIC -o core/libemergency.so core/emergency.c
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://advaybhatia18.github.io,http://127.0.0.1:5500,http://localhost:5500
